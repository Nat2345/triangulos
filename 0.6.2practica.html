<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área del Triángulo - VER 3.0</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

   
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/signos/portada.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top rounded">
                <span class="fw-bold">PRACTICAS JAVASCRIPT</span>
            </a>
        </div>
    </nav>

    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                
                <div class="card shadow border-0 rounded-4 p-4 bg-white">
                    <h2 class="text-center text-primary fw-bold mb-2">Área del Triángulo</h2>
                    <p class="text-center text-muted small mb-4">VER 3.0</p>
                    <hr class="text-muted opacity-25">

                    <div class="row align-items-center g-4 mt-2">

                        <div class="col-md-6">
                           
                            <div class="mb-3">
                                <label for="base" class="form-label fw-semibold text-secondary">Base: <span id="vb" class="text-primary fw-bold">1</span></label>
                                <input type="range" class="form-range" id="base" min="1" max="100" value="1">
                            </div>

                            
                            <div class="mb-4">
                                <label for="altura" class="form-label fw-semibold text-secondary">Altura: <span id="va" class="text-primary fw-bold">1</span></label>
                                <input type="range" class="form-range" id="altura" min="1" max="100" value="1">
                            </div>

                           
                            <div class="d-grid">
                                <button id="reset" class="btn btn-outline-danger btn-sm fw-semibold">
                                    <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
                                </button>
                            </div>
                        </div>


                        <div class="col-md-6 text-center">
                            <div class="p-3 bg-light rounded-3 border">
                                <h5 class="text-uppercase text-muted fs-6 mb-2">Área</h5>
                                <h1 id="area" class="display-4 fw-bold text-success mb-0">0</h1>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

   
    <script src="js/06.2practica.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
</body>
</html>
